name: Local assistant checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browser-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.6
      - run: uv sync --locked --extra dev
      - run: uv run playwright install chromium
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run pytest -q
      - run: uv run pip-audit --local --skip-editable
      - run: uv build --offline
