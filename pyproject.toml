[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "altinbas-lms-mcp"
version = "0.1.0"
description = "Local, read-only assistant for a personal Altinbas LMS account"
requires-python = ">=3.12,<3.15"
dependencies = [
  "playwright>=1.55,<2",
  "pypdf>=6,<7",
  "python-pptx>=1,<2",
  "python-docx>=1.2,<2",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", "browser-binaries", "browser-profile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
